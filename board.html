<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컴퓨터활용능력 · 전자칠판 수업자료</title>
<script src="lesson.js"></script>
<script src="lesson-plus.js"></script>
<style>
  :root{--bg:#0c1017;--panel:#161c27;--panel2:#1e2634;--line:#2c3648;--ink:#e9eefa;--dim:#98a5bd;
        --accent:#5b8cff;--good:#3ad995;--bad:#ff5f6d;--gold:#ffd166;--r:14px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13.5px;margin:0 0 16px}
  .links{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .links a{color:var(--dim);font-size:13px;text-decoration:none;border:1px solid var(--line);
    border-radius:999px;padding:6px 13px}
  .links a:hover{color:var(--ink);border-color:var(--accent)}
  /* 단원 선택 */
  .gradebar{display:flex;gap:9px;align-items:center;margin:0 0 16px}
  .gradebar .lb{color:var(--dim);font-size:13px;font-weight:700;margin-right:2px}
  .gradebar button{background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:999px;
    padding:9px 18px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:.12s}
  .gradebar button:hover{border-color:var(--accent);color:var(--ink)}
  .gradebar button.on{background:linear-gradient(135deg,#3b82f6,#5b8cff);border-color:transparent;color:#fff}
  .units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px}
  .unit{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;
    cursor:pointer;text-align:left;color:inherit;font:inherit;transition:.12s}
  .unit:hover{border-color:var(--accent);background:var(--panel2);transform:translateY(-2px)}
  .unit b{display:block;font-size:15px;margin-bottom:4px}
  .unit .ds{color:var(--dim);font-size:12.5px}
  .allbtn{width:100%;margin-top:12px;background:linear-gradient(135deg,#3b82f6,#5b8cff);color:#fff;border:0;
    border-radius:var(--r);padding:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
  /* 슬라이드 화면 */
  #board{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,#0d1420,#080b11);
    display:flex;flex-direction:column}
  #board.hidden{display:none!important}
  .b-top{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);
    background:rgba(10,14,20,.92);flex-wrap:wrap}
  .b-top .ttl{font-weight:800;font-size:15px;flex:1;min-width:120px}
  .b-top .pos{color:var(--dim);font-size:12.5px}
  .b-top button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;
    padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  .b-top button:hover{border-color:var(--accent)}
  .b-body{flex:1;overflow:auto;padding:16px 20px 26px}
  .b-in{max-width:1000px;margin:0 auto}
  .b-h{font-size:clamp(20px,3.4vw,30px);font-weight:900;margin:0 0 12px;letter-spacing:-.02em}
  .fig{background:#fff;border-radius:12px;padding:8px;text-align:center;margin-bottom:8px}
  .fig img{max-width:100%;max-height:38vh;object-fit:contain;display:block;margin:0 auto}
  .cap{color:var(--dim);font-size:12.5px;text-align:center;margin:0 0 14px}
  .bl{display:inline-block;min-width:3.4em;padding:0 .35em;margin:0 .12em;border-radius:5px;
      background:#1d3350;border-bottom:2px solid #7fc4ff;color:transparent;cursor:pointer;
      font-weight:800;user-select:none}
  .bl.on{background:rgba(127,196,255,.16);color:#9fe0ff;border-bottom-color:#9fe0ff;cursor:default}
  .pts{list-style:none;padding:0;margin:0 0 14px}
  .pts li{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:9px;padding:11px 14px;margin-bottom:8px;font-size:clamp(14px,2vw,17px)}
  .ask{background:rgba(255,209,102,.12);border:1px solid var(--gold);border-radius:11px;padding:13px 15px;
    margin-bottom:14px;font-size:clamp(14px,2vw,17px)}
  .ask b{color:var(--gold)}
  .quiz{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 15px;margin-bottom:12px}
  .quiz .q{font-weight:700;font-size:clamp(14px,2vw,17px);margin-bottom:10px}
  .quiz ol{margin:0;padding-left:22px}
  .quiz li{padding:5px 0;font-size:clamp(13.5px,1.9vw,16px)}
  .quiz li.on{color:var(--good);font-weight:800}
  .exp{background:rgba(58,217,149,.1);border:1px solid var(--good);border-radius:11px;padding:13px 15px;
    font-size:clamp(13.5px,1.9vw,16px)}
  .b-nav{display:flex;gap:9px;padding:10px 14px;border-top:1px solid var(--line);background:rgba(10,14,20,.92)}
  .b-nav button{flex:1;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
  .b-nav button.main{background:linear-gradient(135deg,#3b82f6,#5b8cff);border-color:transparent;color:#fff}
  .b-nav button:disabled{opacity:.4;cursor:default}
  .hint{color:var(--dim);font-size:12px;text-align:center;margin-top:12px}
  .figsvg{background:#fff;border-radius:12px;padding:12px 10px;margin-bottom:8px}
  .goBtn{display:block;text-align:center;text-decoration:none;margin-top:16px;
    background:linear-gradient(135deg,#0e9f6e,#3ad995);color:#062a1c;font-weight:800;
    border-radius:12px;padding:13px;font-size:15px}
</style>
</head>
<body>

<div class="wrap" id="home">
  <h1>🖥️ 컴퓨터활용능력 · 전자칠판 수업자료</h1>
  <p class="sub">전자칠판·프로젝터로 앞에서 끌고 가는 수업 화면입니다.
     <b>요점 → 발문 → 퀴즈 → 정답</b>을 하나씩 열며 진행하세요. (← → 키 또는 화면 아래 버튼)</p>
  <div class="links">
    <a href="index.html" id="hubLink">💻 학생용 개념게임 →</a>
  </div>
  <div class="gradebar">
    <span class="lb">오늘 수업은</span>
    <button id="g1Btn">1급</button>
    <button id="g2Btn">2급</button>
  </div>
  <div class="units" id="units"></div>
  <button class="allbtn" id="allBtn">▶ 1단원부터 순서대로 시작</button>
  <p class="hint" id="gradeHint"></p>
  <p class="hint">슬라이드 끝의 버튼을 누르면 개념게임 · 필기 CBT · 실기 연습소로 넘어갑니다(<code>?rc=…</code> 유지).</p>
</div>

<div id="board" class="hidden">
  <div class="b-top">
    <button onclick="closeBoard()">← 나가기</button>
    <span class="ttl" id="bTtl"></span>
    <span class="pos" id="bPos"></span>
  </div>
  <div class="b-body"><div class="b-in" id="bIn"></div></div>
  <div class="b-nav">
    <button onclick="prevSlide()" id="bPrev">◀ 이전</button>
    <button class="main" onclick="nextStep()" id="bNext">다음 ▶</button>
  </div>
</div>

<script>
/* lesson.js 가 전역에 LESSON/UNITS 를 선언해 두었다 (같은 이름 재선언 금지) */
var DECK = window.LESSON || [];
var UNIT = window.UNITS || [];
var B = { list: [], i: 0, step: 0 };   // step 0 요점 → 1 발문 → 2 퀴즈 → 3 정답

/* ── 급수 고르기 ── 2급을 고르면 1급 전용 슬라이드를 빼고 보여 준다.
   마지막에 고른 급수를 기억해 다음 수업에 그대로 열리게 한다. */
var GRADE = 2;
try { GRADE = Number(localStorage.getItem('board_grade')) === 1 ? 1 : 2; } catch(e){}

/* 그 급수에서 실제로 쓸 슬라이드 번호 목록 */
function idxOf(u){ return GRADE === 1 ? u.idx : (u.idx2 || u.idx); }

/* ── 단원 목록 ── */
function renderHome(){
  document.getElementById('g1Btn').classList.toggle('on', GRADE === 1);
  document.getElementById('g2Btn').classList.toggle('on', GRADE === 2);

  var shown = UNIT.filter(function(u){ return idxOf(u).length > 0; });
  var box = document.getElementById('units');
  box.innerHTML = shown.map(function(u){
    var n = idxOf(u).length;
    return '<button class="unit" data-u="'+esc(u.name)+'"><b>'+esc(u.name)+'</b>'
         + '<span class="ds">슬라이드 '+n+'장</span></button>';
  }).join('');

  var total = shown.reduce(function(a,u){ return a + idxOf(u).length; }, 0);
  document.getElementById('allBtn').textContent =
    '▶ 1단원부터 순서대로 시작 (' + total + '장)';

  var hidden = UNIT.filter(function(u){ return idxOf(u).length === 0; })
                   .map(function(u){ return u.name; });
  document.getElementById('gradeHint').innerHTML = GRADE === 1
    ? '<b>1급 수업</b> — 데이터베이스(액세스)까지 모두 나옵니다. 슬라이드 ' + total + '장.'
    : '<b>2급 수업</b> — 스프레드시트까지만 나옵니다. 슬라이드 ' + total + '장.'
      + (hidden.length ? ' <span style="color:var(--dim)">(1급 전용이라 숨김 : ' + esc(hidden.join(' · ')) + ')</span>' : '');
}
(function bindHome(){
  var box = document.getElementById('units');
  box.addEventListener('click', function(e){
    var b = e.target.closest('[data-u]'); if(!b) return;
    var u = UNIT.filter(function(x){ return x.name === b.dataset.u; })[0];
    if(u) openBoard(idxOf(u));
  });
  document.getElementById('allBtn').onclick = function(){
    var list = [];
    UNIT.forEach(function(u){ idxOf(u).forEach(function(i){ list.push(i); }); });
    openBoard(list);
  };
  function setGrade(g){
    GRADE = g;
    try { localStorage.setItem('board_grade', String(g)); } catch(e){}
    renderHome();
  }
  document.getElementById('g1Btn').onclick = function(){ setGrade(1); };
  document.getElementById('g2Btn').onclick = function(){ setGrade(2); };
  renderHome();
})();

/* 선생님이 ?rc=… 로 열었다면 학생용 도구로 넘어갈 때도 그대로 붙여 준다 */
function withRc(url){
  var rc = new URLSearchParams(location.search).get('rc');
  if(!rc) return url;
  return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'rc=' + encodeURIComponent(rc);
}
(function(){
  var a = document.getElementById('hubLink');
  if(a) a.href = withRc('index.html');
})();

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

function openBoard(list){
  B = { list: list, i: 0, step: 0 };
  document.getElementById('board').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  render();
}
function closeBoard(){
  document.getElementById('board').classList.add('hidden');
  document.body.style.overflow = '';
}
function render(){
  var s = DECK[B.list[B.i]]; if(!s) return;
  document.getElementById('bTtl').textContent = s.u || '';
  document.getElementById('bPos').textContent = (B.i+1) + ' / ' + B.list.length;

  var h = '<h2 class="b-h">' + esc(s.t) + '</h2>';
  if(s.svg) h += '<div class="figsvg">' + s.svg + '</div>';
  if(s.img) h += '<div class="fig"><img src="' + s.img + '" alt=""></div>';
  if(s.cap) h += '<p class="cap">' + esc(s.cap) + '</p>';
  /* 본문의 {{답}} 은 빈칸 — 눌러야 답이 보인다. */
  h += '<ul class="pts">' + (s.pts||[]).map(function(p){
         return '<li>' + String(p).replace(/\{\{(.+?)\}\}/g, function(_, a){
           return '<span class="bl" tabindex="0">' + esc(a) + '</span>';
         }) + '</li>';
       }).join('') + '</ul>';

  if(B.step >= 1 && s.ask) h += '<div class="ask"><b>발문</b> — ' + esc(s.ask) + '</div>';
  if(B.step >= 2 && s.ansq){
    h += '<div class="quiz"><div class="q">' + s.ansq + '</div><ol>'
       + (s.anso||[]).map(function(o,i){
           var on = (B.step >= 3 && i === s.ansa) ? ' class="on"' : '';
           return '<li' + on + '>' + esc(o) + (B.step>=3 && i===s.ansa ? '  ✔' : '') + '</li>';
         }).join('') + '</ol></div>';
  }
  if(B.step >= 3 && s.anse) h += '<div class="exp">💡 ' + s.anse + '</div>';
  /* 정답까지 열고 나면 그 주제의 학생용 도구로 바로 넘어갈 수 있게 한다 */
  if(B.step >= 3 && s.go)
    h += '<a class="goBtn" target="_blank" rel="noopener" href="' + withRc(s.go[1]) + '">'
       + esc(s.go[0]) + ' ↗</a>';

  document.getElementById('bIn').innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll('#bIn .bl'), function(el){
    function open(){ el.classList.add('on'); }
    el.addEventListener('click', open);
    /* tabindex 가 있으니 키보드·프레젠터 리모컨으로도 열 수 있어야 한다 */
    el.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); open(); }
    });
  });
  document.querySelector('.b-body').scrollTop = 0;
  document.getElementById('bPrev').disabled = (B.i === 0 && B.step === 0);
  document.getElementById('bNext').textContent =
    B.step < 3 ? ['발문 열기 ▶','퀴즈 열기 ▶','정답 열기 ▶'][B.step]
               : (B.i === B.list.length-1 ? '수업 마치기' : '다음 슬라이드 ▶');
}
function nextStep(){
  var s = DECK[B.list[B.i]];
  /* 발문·퀴즈가 없는 슬라이드는 건너뛴다 */
  if(B.step < 3){
    B.step++;
    if(B.step === 1 && !s.ask) B.step++;
    if(B.step === 2 && !s.ansq) B.step = 3;
    if(B.step === 3 && !s.anse && !s.ansq){ nextSlide(); return; }
    render(); return;
  }
  nextSlide();
}
function nextSlide(){
  if(B.i >= B.list.length - 1){ closeBoard(); return; }
  B.i++; B.step = 0; render();
}
function prevSlide(){
  if(B.step > 0){ B.step = 0; render(); return; }
  if(B.i > 0){ B.i--; B.step = 0; render(); }
}
document.addEventListener('keydown', function(e){
  if(document.getElementById('board').classList.contains('hidden')) return;
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); nextStep(); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); prevSlide(); }
  else if(e.key === 'Escape'){ closeBoard(); }
});
</script>
</body>
</html>
